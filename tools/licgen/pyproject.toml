[project]
name = "licgen"
version = "0.1.0"
description = "라이선스 발급기 — 공급사 발급 서버 전용 (개인키를 다룬다)"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "pyyaml>=6.0", "typer>=0.12"]

[project.scripts]
licgen = "licgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licgen"]
