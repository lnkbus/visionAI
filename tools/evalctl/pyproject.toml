[project]
name = "evalctl"
version = "0.1.0"
description = "골든셋 평가 하네스 — 검색·PII·TTS 품질을 수치로 고정한다"
requires-python = ">=3.11"
dependencies = [
    "vai-contracts",
    "vai-retrieval",
    "vai-flt-micro",
    "vai-tts-core",
    "typer>=0.12",
]

[project.scripts]
evalctl = "evalctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalctl"]
