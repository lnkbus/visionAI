# PoC·데모·로컬 개발용 단일 서버 구성.
#
# 폐쇄망 고객사 PoC는 "GPU 서버 한 대"로 시작하는 경우가 많아, K8s 없이도
# 전체 파이프라인이 도는 경로를 유지한다. 운영 배포는 Helm/K3s를 쓴다.
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#   → http://localhost:8080/demo

name: visionai

x-block: &block
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  # 라이선스는 CORE-LIC이 쓰고 나머지는 읽기만 한다. 읽기 전용으로 붙여
  # 어떤 블록도 자기 라이선스를 고쳐 쓸 수 없게 한다.
  volumes:
    - license-data:/licenses:ro
  environment: &block-env
    VAI_REDIS_URL: redis://redis:6379/0
    VAI_CORE_BUS_URL: http://core-bus:8081
    VAI_LOG_LEVEL: INFO
    VAI_ENVIRONMENT: compose
    VAI_LICENSE_PATH: /licenses/customer.lic
    # 공개키가 없으므로 이 구성은 서명 검증을 하지 않는다(개발 경로).
    # 운영 이미지는 릴리스 빌드가 공개키를 내장한 채로 나간다.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  qdrant:
    # 사양서 지정 벡터 DB. RAG-KB(색인)와 RAG-SRCH(조회)가 별도 컨테이너이므로
    # 반드시 공유 저장소가 필요하다 — memory 어댑터는 단일 프로세스 전용이다.
    image: qdrant/qdrant:v1.12.1
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage

  core-lic:
    # 라이선스 설치 창구. 라이선스가 없어도 떠야 하는 유일한 블록이다 —
    # 설치기가 라이선스를 요구하면 최초 구축에서 아무도 설치할 수 없다.
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: core-lic
    environment:
      <<: *block-env
      VAI_BLOCK_ID: CORE-LIC
    volumes:
      - license-data:/licenses
    ports:
      - "8095:8095"

  core-sec:
    # 감사 저장소. 해시 체인은 단일 라이터를 전제하므로 **복제하지 않는다** —
    # 여러 인스턴스가 같은 디렉토리에 쓰면 체인이 깨진다.
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: core-sec
    environment:
      <<: *block-env
      VAI_BLOCK_ID: CORE-SEC
      VAI_CONSUMER_GROUP: sec
      VAI_CONSUMER_NAME: sec-1
      VAI_SEC_AUDIT_DIR: /var/lib/visionai/audit
      # 마스터 키를 지정하면 저장 암호화가 켜진다. 데모 구성은 감사만 쓴다:
      #   VAI_SEC_MASTER_KEY_PATH: /run/secrets/master.key
    volumes:
      - license-data:/licenses:ro
      - audit-data:/var/lib/visionai/audit
    ports:
      - "8096:8096"

  core-bus:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: core-bus
    environment:
      <<: *block-env
      VAI_BLOCK_ID: CORE-BUS
    ports:
      - "8081:8081"

  core-gw:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: core-gw
    environment:
      <<: *block-env
      VAI_BLOCK_ID: CORE-GW
      # compose는 데모용이라 인증을 열어 둔다. 운영 values에서는 반드시 false.
      VAI_GW_DEV_AUTH: "true"
      VAI_GW_DEMO_ENABLED: "true"
      VAI_GW_JWT_SECRET: compose-dev-secret-not-for-production-use
    depends_on:
      redis:
        condition: service_healthy
      core-bus:
        condition: service_started
    ports:
      - "8080:8080"

  aud-vad:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: aud-vad
    environment:
      <<: *block-env
      VAI_BLOCK_ID: AUD-VAD
      VAI_CONSUMER_GROUP: vad
      VAI_CONSUMER_NAME: vad-1
      # GPU가 있고 silero extra를 설치했다면 silero로 바꾼다.
      VAI_VAD_ADAPTER: energy

  stt-core:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: stt-core
    environment:
      <<: *block-env
      VAI_BLOCK_ID: STT-CORE
      VAI_CONSUMER_GROUP: stt
      VAI_CONSUMER_NAME: stt-1
      # 기본은 GPU 없이 도는 fake. 실제 인식은 아래 두 줄을 바꾼다:
      #   VAI_STT_ADAPTER: faster_whisper
      #   VAI_STT_MODEL_PATH: /models/faster-whisper-large-v3
      VAI_STT_ADAPTER: fake
      # FLT-MICRO가 붙었으므로 STT의 UI 직송은 끈다.
      # 켜 두면 마스킹 전 텍스트가 화면에 스친다.
      VAI_STT_PUBLISH_UI: "false"
    # volumes:
    #   - /opt/visionai/models:/models:ro   # 폐쇄망 반입 모델 마운트

  flt-micro:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: flt-micro
    environment:
      <<: *block-env
      VAI_BLOCK_ID: FLT-MICRO
      VAI_CONSUMER_GROUP: flt
      VAI_CONSUMER_NAME: flt-1
      VAI_FLT_RULES_PATH: /etc/visionai/compliance-rules.json
    volumes:
      - ./compliance-rules.json:/etc/visionai/compliance-rules.json:ro
      # 앵커의 volumes는 덮어써지므로 라이선스 볼륨을 다시 붙인다.
      - license-data:/licenses:ro

  llm-gw:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: llm-gw
    environment:
      <<: *block-env
      VAI_BLOCK_ID: LLM-GW
      # 폐쇄망 운영에서는 vLLM을 가리킨다:
      #   VAI_LLM_ADAPTER: openai_compatible
      #   VAI_LLM_ADAPTER_CONFIG: '{"base_url":"http://vllm:8000/v1",
      #     "models":{"slm":"qwen2.5-1.5b","default":"qwen2.5-14b"}}'
      VAI_LLM_ADAPTER: echo
    ports:
      - "8085:8085"

  rag-kb:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: rag-kb
    environment:
      <<: *block-env
      VAI_BLOCK_ID: RAG-KB
      # 운영에서는 로컬 임베딩 모델로 바꾼다:
      #   VAI_RAG_EMBEDDER: sentence_transformers
      #   VAI_RAG_EMBEDDER_MODEL: /models/ko-embedding
      VAI_RAG_EMBEDDER: hashing
      VAI_RAG_STORE: qdrant
      VAI_RAG_STORE_CONFIG: '{"url":"http://qdrant:6333"}'
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8086:8086"

  rag-srch:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: rag-srch
    environment:
      <<: *block-env
      VAI_BLOCK_ID: RAG-SRCH
      VAI_SRCH_EMBEDDER: hashing
      VAI_SRCH_STORE: qdrant
      VAI_SRCH_STORE_CONFIG: '{"url":"http://qdrant:6333"}'
      VAI_SRCH_RERANKER: lexical
      # 재시작 시 BM25 색인을 Qdrant 기준으로 복원한다. 빠뜨리면 검색이
      # 밀집 축만으로 도는 '절반만 동작하는' 상태가 된다.
      VAI_SRCH_WARM_TENANTS: demo:default
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8087:8087"

  ta-assist:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: ta-assist
    environment:
      <<: *block-env
      VAI_BLOCK_ID: TA-ASSIST
      VAI_CONSUMER_GROUP: assist
      VAI_CONSUMER_NAME: assist-1
      VAI_ASSIST_SEARCH_URL: http://rag-srch:8087
      VAI_ASSIST_LLM_URL: http://llm-gw:8085
    depends_on:
      redis:
        condition: service_healthy
      rag-srch:
        condition: service_started
      llm-gw:
        condition: service_started

  llm-sum:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: llm-sum
    environment:
      <<: *block-env
      VAI_BLOCK_ID: LLM-SUM
      VAI_CONSUMER_GROUP: sum
      VAI_CONSUMER_NAME: sum-1
      VAI_SUM_LLM_URL: http://llm-gw:8085
    depends_on:
      redis:
        condition: service_healthy
      llm-gw:
        condition: service_started
    ports:
      - "8089:8089"

  scn-studio:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: scn-studio
    environment:
      <<: *block-env
      VAI_BLOCK_ID: SCN-STUDIO
      # 룰 테스트를 실제 필터 구현으로 돌린다 — 저작 화면 결과와 상담 동작이
      # 갈라지면 도구가 아니라 함정이 된다.
      VAI_STUDIO_FILTER_URL: http://flt-micro:8084
      VAI_STUDIO_SEARCH_URL: http://rag-srch:8087
      VAI_STUDIO_KB_URL: http://rag-kb:8086
    depends_on:
      redis:
        condition: service_healthy
      flt-micro:
        condition: service_started
      rag-srch:
        condition: service_started
    ports:
      - "8090:8090"

  ui-agent:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: ui-agent
    environment:
      <<: *block-env
      VAI_BLOCK_ID: UI-AGENT
      VAI_AGENTUI_STUDIO_URL: http://scn-studio:8090
      VAI_AGENTUI_SUMMARY_URL: http://llm-sum:8089
    depends_on:
      redis:
        condition: service_healthy
      scn-studio:
        condition: service_started
      llm-sum:
        condition: service_started
    ports:
      - "8091:8091"

  aud-rtp:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: aud-rtp
    environment:
      <<: *block-env
      VAI_BLOCK_ID: AUD-RTP
      VAI_RTP_PORT_START: "40000"
      VAI_RTP_PORT_END: "40100"
    ports:
      - "8092:8092"
      # RTP는 UDP다. 고객사 미디어 게이트웨이가 이 대역으로 보낸다.
      - "40000-40100:40000-40100/udp"

  spk-dia:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: spk-dia
    environment:
      <<: *block-env
      VAI_BLOCK_ID: SPK-DIA
      VAI_CONSUMER_GROUP: dia
      VAI_CONSUMER_NAME: dia-1
      # 운영에서는 신경망 임베더로 바꾼다. spectral은 음역이 뚜렷이 다른
      # 화자만 가른다:
      #   VAI_DIA_EMBEDDER: speechbrain
      #   VAI_DIA_EMBEDDER_MODEL: /models/ecapa-tdnn
      VAI_DIA_EMBEDDER: spectral
    ports:
      - "8093:8093"

  ui-meet:
    <<: *block
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BLOCK: ui-meet
    environment:
      <<: *block-env
      VAI_BLOCK_ID: UI-MEET
      VAI_MEETUI_SUMMARY_URL: http://llm-sum:8089
      VAI_MEETUI_DIARIZATION_URL: http://spk-dia:8093
    depends_on:
      redis:
        condition: service_healthy
      llm-sum:
        condition: service_started
      spk-dia:
        condition: service_started
    ports:
      - "8094:8094"

volumes:
  redis-data:
  audit-data:
  qdrant-data:
  license-data:
