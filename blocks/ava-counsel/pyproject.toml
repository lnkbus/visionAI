[project]
name = "vai-ava-counsel"
version = "0.1.0"
description = "AVA-COUNSEL — 아바타 가상상담원 (입 모양 타임라인·상태 전환)"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_ava_counsel"]
