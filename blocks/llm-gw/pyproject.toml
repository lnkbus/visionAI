[project]
name = "vai-llm-gw"
version = "0.2.0"
description = "LLM-GW — sLLM 서빙 게이트웨이"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_llm_gw"]
