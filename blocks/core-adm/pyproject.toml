[project]
name = "vai-core-adm"
version = "0.1.0"
description = "CORE-ADM — 운영 콘솔 (블록 상태·라이선스 현황·감사 조회)"
requires-python = ">=3.11"
dependencies = [
    "vai-contracts",
    "vai-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_core_adm"]
