[project]
name = "vai-core-sec"
version = "0.1.0"
description = "CORE-SEC — 저장 암호화(KCMVP 연동 지점)와 해시 체인 감사 로그"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_core_sec"]
