<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VisionAI 스마트 회의록</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb;
          --accent:#2563eb; --ok:#15803d; --card:#f9fafb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af;
          --line:#272b33; --accent:#60a5fa; --ok:#4ade80; --card:#161a21; } }
  /* 화자별 색. 12명까지 구분되며, 넘으면 순환한다. */
  .sp1{--c:#2563eb}.sp2{--c:#15803d}.sp3{--c:#b45309}.sp4{--c:#7c3aed}
  .sp5{--c:#be123c}.sp6{--c:#0e7490}.sp7{--c:#a16207}.sp8{--c:#4d7c0f}
  .sp9{--c:#9333ea}.sp10{--c:#0369a1}.sp11{--c:#c2410c}.sp12{--c:#166534}
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:14px/1.65 -apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif; }
  main { max-width:1120px; margin:0 auto; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  .hint { color:var(--muted); font-size:12px; }
  code { background:var(--card,#f4f5f7); padding:1px 5px; border-radius:4px; font-size:12px; }
  .bar { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
          background:var(--bg); color:var(--fg); }
  button { font:inherit; padding:7px 14px; border-radius:7px; border:1px solid transparent;
           background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .status { margin-left:auto; font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .dot.on { background:var(--ok); }
  .grid { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; align-items:start; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  section { border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--card); }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  #transcript { min-height:340px; max-height:58vh; overflow-y:auto; }
  .line { padding:5px 0 5px 10px; border-left:3px solid transparent; }
  .line.labeled { border-left-color:var(--c, var(--line)); }
  .line.interim { opacity:.5; font-style:italic; }
  .who { font-size:11px; font-weight:600; color:var(--c, var(--muted)); margin-right:8px; }
  .who.pending { color:var(--muted); font-weight:400; }
  .roster { display:flex; flex-direction:column; gap:6px; }
  .person { display:flex; gap:8px; align-items:center; }
  .person .swatch { width:10px; height:10px; border-radius:50%; background:var(--c, var(--muted)); flex:0 0 auto; }
  .person input { flex:1; min-width:0; padding:4px 7px; font-size:13px; }
  .person .talk { font-size:11px; color:var(--muted); white-space:nowrap; }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; }
  dt { color:var(--muted); font-size:12px; }
  dd { margin:0; }
  ul { margin:4px 0 0; padding-left:18px; font-size:13px; }
  .action { margin-bottom:4px; }
  .action .owner { font-size:11px; color:var(--muted); margin-left:6px; }
  .empty { color:var(--muted); font-size:13px; }
  .msg { font-size:12px; margin-top:8px; min-height:16px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>스마트 회의록</h1>
    <span class="sub">화자 라벨은 자막보다 조금 늦게 붙는다 — 화자분리가 인식보다 느리기 때문이다</span>
  </header>

  <div class="bar">
    <button id="start">회의 시작</button>
    <button id="finish" class="ghost" disabled>회의 종료</button>
    <span class="hint">이 기기의 마이크로 회의를 연다</span>
  </div>

  <p class="sub" id="invite" hidden>
    다른 참석자는 이 주소로 들어와 <b>회의 시작</b>을 누르면 같은 회의에 붙는다.
    <code id="invite-url"></code>
    <button id="invite-copy" class="ghost">복사</button>
  </p>

  <div class="bar">
    <div>
      <label for="session">세션 ID</label>
      <input id="session" placeholder="sess_20260805_ab12cd34" size="30" />
    </div>
    <button id="connect" class="ghost">회의 참관</button>
    <button id="disconnect" class="ghost" disabled>중지</button>
    <button id="load" class="ghost">회의록 불러오기</button>
    <span class="status"><span class="dot" id="dot"></span><span id="state">대기</span></span>
  </div>

  <div class="grid">
    <section>
      <h2>실시간 자막</h2>
      <div id="transcript"><p class="empty">회의를 시작하면 자막이 여기에 흐른다. 이미 도는 회의를 보려면 아래에 세션 ID를 넣는다.</p></div>
    </section>

    <div>
      <section>
        <h2>참석자</h2>
        <div class="roster" id="roster"><p class="empty">발화가 감지되면 화자가 나타난다.</p></div>
        <div class="msg" id="roster-msg"></div>
      </section>

      <section style="margin-top:14px">
        <h2>회의록</h2>
        <div id="minutes"><p class="empty">회의 종료 후 생성된다.</p></div>
      </section>
    </div>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const els = {
  session: $("session"), connect: $("connect"), disconnect: $("disconnect"),
  dot: $("dot"), state: $("state"), transcript: $("transcript"),
  roster: $("roster"), minutes: $("minutes"), rosterMsg: $("roster-msg"),
  start: $("start"), finish: $("finish"),
  invite: $("invite"), inviteUrl: $("invite-url"), inviteCopy: $("invite-copy"),
};

let ws = null;
let interimLine = null;
// 화자 라벨이 자막보다 늦게 오므로, 자막 줄을 start_ms로 찾아 나중에 갱신한다.
const linesByStart = new Map();
const speakers = new Map();   // speaker_id → {index, name, segments, total_ms}
const pendingLabels = new Map();

const setState = (text, live = false) => {
  els.state.textContent = text;
  els.dot.classList.toggle("on", live);
};

const clearEmpty = (node) => node.querySelector(".empty")?.remove();

function speakerSlot(speakerId) {
  if (!speakers.has(speakerId)) {
    speakers.set(speakerId, { index: speakers.size + 1, name: "", segments: 0, total_ms: 0 });
    renderRoster();
  }
  return speakers.get(speakerId);
}

function labelFor(speakerId) {
  const slot = speakerSlot(speakerId);
  return slot.name || `화자 ${slot.index}`;
}

// ── 자막 ─────────────────────────────────────────────────────────────────────
function renderCaption(stt, startMs) {
  clearEmpty(els.transcript);
  const line = (!stt.is_final && interimLine) ? interimLine : document.createElement("div");
  line.className = "line" + (stt.is_final ? "" : " interim");
  line.replaceChildren();

  const who = document.createElement("span");
  who.className = "who pending";
  who.textContent = "…";
  const text = document.createElement("span");
  text.textContent = stt.text;
  line.append(who, text);
  line.dataset.startMs = String(startMs ?? "");

  if (!line.isConnected) els.transcript.append(line);
  if (stt.is_final && startMs != null) {
    linesByStart.set(startMs, line);
    // 라벨이 자막보다 먼저 온 경우 — 여기서 바로 적용한다.
    if (pendingLabels.has(startMs)) {
      applyLabel(line, pendingLabels.get(startMs));
      pendingLabels.delete(startMs);
    }
  }
  interimLine = stt.is_final ? null : line;
  els.transcript.scrollTop = els.transcript.scrollHeight;
}

function applyLabel(line, speakerId) {
  const slot = speakerSlot(speakerId);
  line.classList.add("labeled", `sp${((slot.index - 1) % 12) + 1}`);
  const who = line.querySelector(".who");
  who.className = "who";
  who.textContent = labelFor(speakerId);
  line.dataset.speakerId = speakerId;
}

function onSpeakerLabel(message) {
  const slot = speakerSlot(message.speaker_id);
  slot.segments += 1;
  slot.total_ms += message.duration_ms ?? 0;
  renderRoster();

  const line = linesByStart.get(message.start_ms);
  if (line) applyLabel(line, message.speaker_id);
  else pendingLabels.set(message.start_ms, message.speaker_id);
}

// ── 참석자 ───────────────────────────────────────────────────────────────────
function renderRoster() {
  if (!speakers.size) return;
  clearEmpty(els.roster);
  els.roster.replaceChildren();

  const ordered = [...speakers.entries()].sort((a, b) => b[1].total_ms - a[1].total_ms);
  for (const [speakerId, slot] of ordered) {
    const row = document.createElement("div");
    row.className = `person sp${((slot.index - 1) % 12) + 1}`;

    const swatch = document.createElement("span");
    swatch.className = "swatch";

    const input = document.createElement("input");
    input.placeholder = `화자 ${slot.index} — 실명 입력`;
    input.value = slot.name;
    input.addEventListener("change", () => {
      slot.name = input.value.trim();
      // 이미 그려진 자막 줄의 이름도 함께 바꾼다.
      for (const line of els.transcript.querySelectorAll(`[data-speaker-id="${speakerId}"]`)) {
        line.querySelector(".who").textContent = labelFor(speakerId);
      }
      saveNames();
    });

    const talk = document.createElement("span");
    talk.className = "talk";
    talk.textContent = `${Math.round(slot.total_ms / 1000)}초 · ${slot.segments}회`;

    row.append(swatch, input, talk);
    els.roster.append(row);
  }
}

async function saveNames() {
  const sessionId = els.session.value.trim();
  if (!sessionId) return;
  const names = [...speakers.entries()]
    .filter(([, slot]) => slot.name)
    .map(([speaker_id, slot]) => ({ speaker_id, display_name: slot.name }));
  try {
    await fetch(`/v1/meet/speakers/${encodeURIComponent(sessionId)}`, {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, names }),
    });
    els.rosterMsg.textContent = "이름 저장됨";
  } catch {
    els.rosterMsg.textContent = "이름 저장 실패 — 화면에는 반영된다";
  }
}

// ── 회의록 ───────────────────────────────────────────────────────────────────
function renderMinutes(summary) {
  const box = els.minutes;
  box.replaceChildren();

  if (summary.status !== "ready") {
    const note = document.createElement("p");
    note.className = "empty";
    // "기다리는 중"과 "만드는 중"을 구분해서 적는다. 둘 다 "생성 중…"으로
    // 뭉뚱그리면, 실시간 인식에 양보하느라 안 시작한 것인지 모델이 느린 것인지
    // 알 수 없고, 사용자는 대개 실패했다고 판단한다.
    if (summary.status === "failed") {
      note.textContent = `회의록 생성 실패: ${summary.error ?? "원인 미상"}`;
    } else if (summary.status === "waiting") {
      note.textContent = "실시간 인식이 끝나기를 기다리는 중 — 회의록은 인식이 한가해지면 시작한다";
    } else {
      note.textContent = "회의록 생성 중…";
    }
    box.append(note);
    scheduleRefresh(summary.status);
    return;
  }
  stopRefresh();

  const meeting = summary.meeting ?? {};
  if (meeting.title) {
    const title = document.createElement("div");
    title.style.fontWeight = "600";
    title.textContent = meeting.title;
    box.append(title);
  }

  for (const [label, items] of [["안건", meeting.agenda], ["결정사항", meeting.decisions]]) {
    if (!items?.length) continue;
    const dt = document.createElement("div");
    dt.className = "sub";
    dt.style.marginTop = "8px";
    dt.textContent = label;
    const ul = document.createElement("ul");
    for (const item of items) {
      const li = document.createElement("li");
      li.textContent = item;
      ul.append(li);
    }
    box.append(dt, ul);
  }

  if (meeting.action_items?.length) {
    const dt = document.createElement("div");
    dt.className = "sub";
    dt.style.marginTop = "8px";
    dt.textContent = "실행항목";
    box.append(dt);
    for (const item of meeting.action_items) {
      const row = document.createElement("div");
      row.className = "action";
      row.textContent = `☐ ${item.text}`;
      if (item.owner || item.due) {
        const meta = document.createElement("span");
        meta.className = "owner";
        meta.textContent = [item.owner, item.due].filter(Boolean).join(" · ");
        row.append(meta);
      }
      box.append(row);
    }
  }

  const meta = document.createElement("div");
  meta.className = "sub";
  meta.style.marginTop = "10px";
  const bits = [`모델 ${summary.model || "—"}`, `프롬프트 ${summary.prompt_version}`];
  if (summary.waited_for_stt_ms > 0) {
    // 얼마나 기다렸는지 남긴다. 이 값이 자주 커지면 장비가 모자란다는 뜻이고,
    // 증설 근거로 쓸 수 있는 유일한 숫자다.
    const waited = `인식 대기 ${(summary.waited_for_stt_ms / 1000).toFixed(0)}초`;
    bits.push(summary.yield_gave_up ? `${waited} (상한 초과, 그대로 진행)` : waited);
  }
  meta.textContent = bits.join(" · ");
  box.append(meta);
}

// 대기/생성 중이면 스스로 다시 확인한다. 요약 완료는 WebSocket 으로도 오지만,
// 나중에 접속한 화면은 그 알림을 놓친다 — 그때 "생성 중…"에서 멈춘 화면만 남는다.
let refreshTimer = null;
function scheduleRefresh(status) {
  if (refreshTimer !== null) return;
  if (status !== "waiting" && status !== "running" && status !== "pending") return;
  refreshTimer = setInterval(() => { void loadSummary(); }, 5000);
}
function stopRefresh() {
  if (refreshTimer !== null) { clearInterval(refreshTimer); refreshTimer = null; }
}

async function loadSummary() {
  const sessionId = els.session.value.trim();
  if (!sessionId) return;
  const response = await fetch(`/v1/meet/summary/${encodeURIComponent(sessionId)}`);
  if (!response.ok) {
    stopRefresh();
    els.minutes.replaceChildren();
    const note = document.createElement("p");
    note.className = "empty";
    note.textContent = "회의록이 아직 없다.";
    els.minutes.append(note);
    return;
  }
  renderMinutes(await response.json());
}

// ── 연결 ─────────────────────────────────────────────────────────────────────
function observe(sessionId) {

  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/v1/meet/stream?session_id=${encodeURIComponent(sessionId)}`);

  ws.addEventListener("open", () => {
    setState(`참관 중 · ${sessionId}`, true);
    els.connect.disabled = true;
    els.disconnect.disabled = false;
  });
  ws.addEventListener("message", (event) => {
    const message = JSON.parse(event.data);
    if (message.event === "agent_assist_update" && message.stt_result) {
      renderCaption(message.stt_result, message.stt_result.start_ms);
    } else if (message.event === "speaker_label") {
      onSpeakerLabel(message);
    } else if (message.session_id && message.profile) {
      renderMinutes(message);
    }
  });
  ws.addEventListener("close", () => { setState("연결 종료"); reset(); });
  ws.addEventListener("error", () => setState("연결 오류"));
}

els.connect.addEventListener("click", () => {
  const sessionId = els.session.value.trim();
  if (!sessionId) { setState("세션 ID가 필요하다"); return; }
  observe(sessionId);
});

// ── 마이크 ───────────────────────────────────────────────────────────────────
// 이 화면은 원래 참관 전용이었다. 회의를 시작하려면 게이트웨이 데모 페이지를
// 먼저 열어 세션을 만들고 그 ID 를 여기 옮겨 적어야 했다 — 고객사 담당자가
// 그 경로를 알 리 없다. 여기서 바로 연다.
//
// 오디오는 UI-MEET 이 게이트웨이로 중계한다. 화면은 포트 하나만 본다.
const TARGET_RATE = 16000;
let micWs = null, audioCtx = null, micStream = null, micNode = null;

const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.filled = 0; }
  process(inputs) {
    const ch = inputs[0]?.[0];
    if (!ch) return true;
    this.buf.push(new Float32Array(ch));
    this.filled += ch.length;
    // 20ms(48k 기준 960샘플)보다 잘게 보내면 소켓 프레임만 늘어난다.
    if (this.filled >= 4096) {
      const merged = new Float32Array(this.filled);
      let at = 0;
      for (const part of this.buf) { merged.set(part, at); at += part.length; }
      this.port.postMessage(merged);
      this.buf = []; this.filled = 0;
    }
    return true;
  }
}
registerProcessor('capture', Capture);
`;

function resample(input, from, to) {
  if (from === to) return input;
  const ratio = from / to;
  const out = new Float32Array(Math.floor(input.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const at = i * ratio;
    const low = Math.floor(at);
    const high = Math.min(low + 1, input.length - 1);
    out[i] = input[low] + (input[high] - input[low]) * (at - low);
  }
  return out;
}

function toPcm16(frames) {
  const out = new Int16Array(frames.length);
  for (let i = 0; i < frames.length; i++) {
    const clamped = Math.max(-1, Math.min(1, frames[i]));
    out[i] = clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff;
  }
  return out;
}

function base64(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

async function startMic(sessionId) {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  });
  audioCtx = new AudioContext({ sampleRate: TARGET_RATE });
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  micNode = new AudioWorkletNode(audioCtx, "capture");
  micNode.port.onmessage = (ev) => {
    if (micWs?.readyState !== WebSocket.OPEN) return;
    const frames = resample(ev.data, audioCtx.sampleRate, TARGET_RATE);
    micWs.send(JSON.stringify({
      event: "audio_data",
      session_id: sessionId,
      format: "pcm_16k",
      // 회의는 채널로 사람을 가르지 않는다. 누가 말했는지는 화자분리가 낸다.
      channel: "customer",
      audio_base64: base64(new Uint8Array(toPcm16(frames).buffer)),
    }));
  };
  audioCtx.createMediaStreamSource(micStream).connect(micNode);
  // 목적지에 안 붙이면 브라우저가 그래프를 놀리는 경우가 있다. 무음 게인으로 붙인다.
  const mute = audioCtx.createGain();
  mute.gain.value = 0;
  micNode.connect(mute).connect(audioCtx.destination);
}

function stopMic() {
  micNode?.disconnect();
  micStream?.getTracks().forEach((track) => track.stop());
  audioCtx?.close();
  micNode = audioCtx = micStream = null;
}

function showInvite(sessionId) {
  const url = new URL(location.href);
  url.searchParams.set("session", sessionId);
  els.inviteUrl.textContent = url.toString();
  els.invite.hidden = false;
}

els.inviteCopy?.addEventListener("click", () => {
  navigator.clipboard?.writeText(els.inviteUrl.textContent);
  els.inviteCopy.textContent = "복사됨";
  setTimeout(() => { els.inviteCopy.textContent = "복사"; }, 1500);
});

async function openMeeting() {
  // 주소에 회의가 적혀 있으면 그 회의에 붙는다. 참여 길이 없으면 사람마다
  // 회의가 새로 생기고 회의록이 인원수만큼 쪼개진다.
  const joining = new URLSearchParams(location.search).get("session");
  const path = joining
    ? `/v1/meet/sessions/${encodeURIComponent(joining)}/join`
    : "/v1/meet/sessions";
  const response = await fetch(path, { method: "POST" });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || `회의를 열지 못했다 (${response.status})`);
  }
  return response.json();
}

els.start.addEventListener("click", async () => {
  els.start.disabled = true;
  try {
    setState("회의 여는 중…");
    const { session_id: sessionId, ws_token: token } = await openMeeting();
    els.session.value = sessionId;
    showInvite(sessionId);

    // 자막은 참관 소켓으로 받는다 — 마이크 소켓과 경로를 나눠야 참관만 하는
    // 사람과 똑같은 화면을 본다.
    observe(sessionId);

    const scheme = location.protocol === "https:" ? "wss" : "ws";
    micWs = new WebSocket(`${scheme}://${location.host}/v1/meet/mic?token=${encodeURIComponent(token)}`);
    micWs.addEventListener("open", async () => {
      try {
        await startMic(sessionId);
        setState(`회의 중 · ${sessionId}`, true);
        els.finish.disabled = false;
      } catch (err) {
        // 마이크 거부가 여기로 온다. 소켓은 열렸는데 소리는 안 가는 상태라
        // 화면이 "회의 중"으로 보이면 안 된다.
        setState(`마이크를 쓸 수 없다: ${err.message}`);
        micWs.close();
      }
    });
    micWs.addEventListener("close", () => { stopMic(); els.start.disabled = false; els.finish.disabled = true; });
    micWs.addEventListener("error", () => setState("마이크 연결 오류"));
  } catch (err) {
    setState(err.message);
    els.start.disabled = false;
  }
});

els.finish.addEventListener("click", () => {
  // 요약은 세션이 닫혀야 돈다. 소켓만 끊으면 회의록이 영영 안 나온다.
  if (micWs?.readyState === WebSocket.OPEN) {
    micWs.send(JSON.stringify({ event: "close_session", session_id: els.session.value.trim() }));
  }
  micWs?.close();
  stopMic();
  els.finish.disabled = true;
  els.start.disabled = false;
  setState("회의 종료 — 회의록 생성 중. 잠시 후 [회의록 불러오기]");
});

// 마이크를 못 쓰는 구성(PBX·회의 시스템에서 오디오가 들어오는 곳)에서는
// 버튼을 지운다. 눌리는데 아무 일도 안 나는 버튼보다 없는 편이 낫다.
void (async () => {
  const response = await fetch("/v1/meet/capabilities").catch(() => null);
  const able = response?.ok ? (await response.json()).mic : false;
  if (!able) {
    els.start.hidden = els.finish.hidden = true;
    document.querySelector(".hint").textContent = "이 배포는 참관 전용이다 — 오디오는 회의 시스템에서 들어온다";
  }
})();

// 참여 링크로 들어왔으면 세션 칸을 미리 채워 둔다.
{
  const joining = new URLSearchParams(location.search).get("session");
  if (joining) {
    els.session.value = joining;
    els.start.textContent = "회의 참여";
    setState(`참여 대기 · ${joining}`);
  }
}

function reset() {
  els.connect.disabled = false;
  els.disconnect.disabled = true;
  interimLine = null;
}

els.disconnect.addEventListener("click", () => { ws?.close(); reset(); setState("대기"); });

$("load").addEventListener("click", () => { void loadSummary(); });
</script>
</body>
