[project]
name = "vai-ui-meet"
version = "0.2.0"
description = "UI-MEET — 스마트 회의록 화면"
requires-python = ">=3.12"
dependencies = [
    "vai-contracts",
    "vai-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # 브라우저 마이크를 CORE-GW 오디오 소켓으로 중계한다. uvicorn[standard] 가
    # 딸려 오게 하긴 하지만 그건 서버 쪽 구현이고, 우리는 **클라이언트로** 쓴다.
    # 남의 부수효과에 기대면 uvicorn 이 구현을 바꾸는 날 회의 마이크가 죽는다.
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_ui_meet"]
