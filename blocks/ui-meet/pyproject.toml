[project]
name = "vai-ui-meet"
version = "0.2.0"
description = "UI-MEET — 스마트 회의록 화면"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_ui_meet"]
