[project]
name = "vai-ui-agent"
version = "0.1.0"
description = "UI-AGENT — 상담원 워크스페이스"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_ui_agent"]
