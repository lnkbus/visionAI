[project]
name = "vai-core-gw"
version = "0.2.0"
description = "CORE-GW — API/WebSocket 게이트웨이"
requires-python = ">=3.11"
dependencies = [
    "vai-contracts",
    "vai-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_core_gw"]
