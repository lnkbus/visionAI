[project]
name = "vai-llm-sum"
version = "0.1.0"
description = "LLM-SUM — 요약 & 분석"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_llm_sum"]
