[project]
name = "vai-aud-rtp"
version = "0.1.0"
description = "AUD-RTP — SIP/RTP 인입 게이트웨이"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_aud_rtp"]
