[project]
name = "vai-rag-srch"
version = "0.3.0"
description = "RAG-SRCH — 하이브리드 검색 & 리랭킹"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "vai-retrieval", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
# RAG-KB 와 같은 이유. compose·운영 구성은 qdrant 를 쓴다.
qdrant = ["vai-retrieval[qdrant]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_rag_srch"]
