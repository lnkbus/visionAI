[project]
name = "vai-bot-voice"
version = "0.1.0"
description = "BOT-VOICE — 음성봇 대화 엔진 (시나리오 진행·슬롯·사람 연결)"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "vai-retrieval", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_bot_voice"]
