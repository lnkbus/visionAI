[project]
name = "vai-core-bus"
version = "0.2.0"
description = "CORE-BUS — 세션 오케스트레이터 & 이벤트 버스"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_core_bus"]
