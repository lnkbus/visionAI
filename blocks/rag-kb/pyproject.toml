[project]
name = "vai-rag-kb"
version = "0.1.0"
description = "RAG-KB — 지식베이스 수집기"
requires-python = ">=3.11"
dependencies = ["vai-contracts", "vai-common", "vai-retrieval", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_rag_kb"]
