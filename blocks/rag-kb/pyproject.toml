[project]
name = "vai-rag-kb"
version = "0.3.0"
description = "RAG-KB — 지식베이스 수집기"
requires-python = ">=3.12"
dependencies = [
    "vai-contracts",
    "vai-common",
    "vai-retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",   # 파일 업로드
    # 문서 파서. HWPX/DOCX는 표준 라이브러리만으로 읽으므로 의존성이 없다 —
    # 에어갭 반입에서 의존성 하나는 검토 대상 하나다.
    "olefile>=0.47",             # HWP 5.0 (CFB 컨테이너) — 공공 조달 필수
    "pypdf>=5.0",                # PDF 텍스트 레이어
]

[project.optional-dependencies]
# 벡터 저장소 클라이언트. 기본 이미지에는 안 넣는다 — memory 어댑터로도
# 단일 프로세스에서는 돌기 때문이다. 다만 compose·운영은 qdrant 를 쓰므로
# 그 구성으로 빌드할 때 EXTRAS=qdrant 를 준다. 안 주면 기동 순간
# ModuleNotFoundError 로 죽고, 그 사실은 컨테이너 로그에만 남는다.
qdrant = ["vai-retrieval[qdrant]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_rag_kb"]
