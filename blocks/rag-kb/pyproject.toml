[project]
name = "vai-rag-kb"
version = "0.3.0"
description = "RAG-KB — 지식베이스 수집기"
requires-python = ">=3.12"
dependencies = [
    "vai-contracts",
    "vai-common",
    "vai-retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",   # 파일 업로드
    # 문서 파서. HWPX/DOCX는 표준 라이브러리만으로 읽으므로 의존성이 없다 —
    # 에어갭 반입에서 의존성 하나는 검토 대상 하나다.
    "olefile>=0.47",             # HWP 5.0 (CFB 컨테이너) — 공공 조달 필수
    "pypdf>=5.0",                # PDF 텍스트 레이어
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_rag_kb"]
