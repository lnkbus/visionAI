[project]
name = "vai-core-lic"
version = "0.1.0"
description = "CORE-LIC — 오프라인 DRM 라이선스 발급요청·설치·현황"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_core_lic"]
