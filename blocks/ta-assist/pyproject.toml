[project]
name = "vai-ta-assist"
version = "0.2.0"
description = "TA-ASSIST — 실시간 Agent Assist"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_ta_assist"]
