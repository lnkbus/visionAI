[project]
name = "vai-scn-studio"
version = "0.2.0"
description = "SCN-STUDIO — 시나리오·룰 저작 스튜디오"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_scn_studio"]
