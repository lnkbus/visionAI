[project]
name = "vai-aud-vad"
version = "0.2.0"
description = "AUD-VAD — 오디오 라우터 & 스트리밍 버퍼 매니저"
requires-python = ">=3.12"
dependencies = ["vai-contracts", "vai-common", "numpy>=1.26"]

[project.optional-dependencies]
silero = ["torch>=2.2", "silero-vad>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_aud_vad"]
