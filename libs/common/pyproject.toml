[project]
name = "vai-common"
version = "0.1.0"
description = "블록 공통 인프라 — 설정·로깅·이벤트 버스 클라이언트·라이선스 게이트"
requires-python = ">=3.11"
dependencies = [
    "vai-contracts",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_common"]
