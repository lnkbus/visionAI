[project]
name = "vai-contracts"
version = "0.1.0"
description = "블록 간 유일한 공유 계약 — 이벤트/프로토콜/매니페스트 스키마"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vai_contracts"]
