name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 정적 검사 · 테스트
    runs-on: ubuntu-latest
    services:
      # 스택 스모크 테스트용. 없으면 해당 테스트만 건너뛰므로 CI가 깨지지는 않지만,
      # Redis 컨슈머 그룹 배선은 인메모리 버스가 대신 검증해 주지 못한다.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --all-packages

      - name: 린트 · 포맷
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 블록 경계 검증
        # 레고블록이 문서상의 약속이 아니라 실제 제약이 되게 하는 게이트.
        run: uv run lint-imports

      - name: 타입 검사
        run: uv run mypy libs blocks tools

      - name: 블록 카탈로그 정합성
        run: uv run blockctl check --root .

      - name: 테스트
        # fake 어댑터와 인메모리 버스 덕에 GPU·Redis 없이 파이프라인 전체가 검증된다.
        run: uv run pytest -q

  secrets-hygiene:
    name: 비밀 자산 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 개인키가 커밋되지 않았는지
        # 릴리스 검사 전체는 공개키 내장을 요구하므로 레포에서는 통과할 수 없다.
        # 여기서는 되돌릴 수 없는 항목 하나 — 개인키 유출만 본다.
        run: |
          uv run --package blockctl python -c "
          from pathlib import Path
          from blockctl.release import _check_no_private_keys, _iter_files
          root = Path('.')
          found = _check_no_private_keys(root, _iter_files(root))
          for f in found:
              print(f)
          raise SystemExit(1 if found else 0)
          "

  chart:
    name: Helm 차트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: 차트 검증
        run: |
          cd deploy/charts/visionai
          helm lint .
          # 기본값과 두 패키지 오버레이가 모두 렌더링되는지 확인한다.
          # 오버레이 하나가 깨지면 그 패키지는 배포 당일에 막힌다.
          helm template visionai . > /dev/null
          helm template visionai . -f values-aicc.yaml > /dev/null
          helm template visionai . -f values-meeting.yaml > /dev/null


  images:
    name: 블록 이미지 빌드
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        block: [core-bus, core-gw, aud-vad, stt-core, flt-micro, llm-gw, llm-sum,
                rag-kb, rag-srch, ta-assist, scn-studio, ui-agent, aud-rtp, spk-dia, ui-meet,
                core-lic, core-sec, core-adm, tts-core, bot-voice]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ${{ matrix.block }} 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BLOCK=${{ matrix.block }}
          push: false
          tags: visionai/${{ matrix.block }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.block }}
          cache-to: type=gha,mode=max,scope=${{ matrix.block }}
