name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 정적 검사 · 테스트
    runs-on: ubuntu-latest
    services:
      # 스택 스모크 테스트용. 없으면 해당 테스트만 건너뛰므로 CI가 깨지지는 않지만,
      # Redis 컨슈머 그룹 배선은 인메모리 버스가 대신 검증해 주지 못한다.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        # 인터프리터는 .python-version 한 곳에서만 정한다. uv가 그것을 읽으므로
        # 여기에 버전을 또 적지 않는다 — 두 번 적으면 두 번째가 언젠가 어긋난다.
        run: uv sync --all-packages

      - name: 린트 · 포맷
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 블록 경계 검증
        # 레고블록이 문서상의 약속이 아니라 실제 제약이 되게 하는 게이트.
        run: uv run lint-imports

      - name: 타입 검사
        run: uv run mypy libs blocks tools

      - name: 블록 카탈로그 정합성
        run: uv run blockctl check --root .

      - name: 패키지 형상 대조
        # 형상이 조용히 어긋나는 것을 막는다. 의도한 변경이면
        # `blockctl freeze <패키지> --write`로 갱신하고 그 diff가 리뷰에 남는다.
        run: |
          for package in meeting aicc voicebot avatar; do
            uv run blockctl freeze "$package" --root .
          done

      - name: 릴리스 시점 이력
        # 이력이 깨지면 "그때 무엇을 납품했나"에 답할 수 없다. 버전 중복·
        # 역행·짧은 커밋 해시는 넣을 때 막지 않으면 나중에 못 고친다.
        run: uv run blockctl history --root .

      - name: 테스트
        # fake 어댑터와 인메모리 버스 덕에 GPU·Redis 없이 파이프라인 전체가 검증된다.
        run: uv run pytest -q

      - name: 품질 회귀
        # pytest도 같은 게이트를 돌지만, 여기서 한 번 더 도는 이유는 로그다.
        # "왜 떨어졌는가"는 실패한 사례 목록을 봐야 알 수 있고, 그건 이 출력에만 있다.
        run: |
          uv run evalctl validate --root .
          uv run evalctl compare --root . -v

  secrets-hygiene:
    name: 비밀 자산 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 개인키가 커밋되지 않았는지
        # 릴리스 검사 전체는 공개키 내장을 요구하므로 레포에서는 통과할 수 없다.
        # 여기서는 되돌릴 수 없는 항목 하나 — 개인키 유출만 본다.
        run: |
          uv run --package blockctl python -c "
          from pathlib import Path
          from blockctl.release import _check_no_private_keys, _iter_files
          root = Path('.')
          found = _check_no_private_keys(root, _iter_files(root))
          for f in found:
              print(f)
          raise SystemExit(1 if found else 0)
          "

  chart:
    name: Helm 차트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: kubeconform 설치
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: 차트 검증
        # helm lint는 "렌더링이 되는가"까지만 본다. 필드 이름을 오타 내도
        # (livenessProbe → livenessProb) 통과하고, 그 오타는 클러스터가
        # 매니페스트를 거절할 때에야 드러난다 — 배포 당일이다.
        # kubeconform이 쿠버네티스 스키마로 그 자리를 막는다.
        run: |
          cd deploy/charts/visionai
          helm lint .
          for overlay in "" "-f values-aicc.yaml" "-f values-meeting.yaml" \
                         "-f values-voicebot.yaml" "-f values-avatar.yaml"; do
            echo "▸ ${overlay:-기본값}"
            helm template visionai . $overlay \
              | kubeconform -strict -summary -kubernetes-version 1.29.0
          done


  installer:
    # 설치 스크립트가 macOS에서도 도는지 **실제로 돌려** 확인한다.
    # 문자열 검사만 하면 "GNU 도구를 안 쓴다"는 것만 알 뿐 "된다"는 것은 모른다.
    # 지원한다고 적어 두고 돌리지 않으면 그건 지원이 아니라 미확인 주장이다.
    name: 설치기 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: bash 버전
        # macOS 기본 bash는 3.2다. 러너가 신형 bash를 주면 3.2 제약을 검증하지
        # 못하므로 무엇으로 돌았는지 로그에 남긴다.
        run: bash --version | head -1

      - name: 문법
        run: |
          for script in deploy/airgap/*.sh deploy/release/build_release.sh; do
            bash -n "$script" && echo "✓ $script"
          done

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else
              sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; fi
          fi
          shellcheck -x -S warning deploy/airgap/*.sh deploy/release/build_release.sh

      - name: 가짜 번들로 사전 점검
        # 이미지도 docker도 없이 도는 경로다(--dry-run). 여기서 GNU 전용
        # 도구를 쓰면 macOS 잡이 즉시 깨진다.
        run: |
          set -euo pipefail
          bundle="$(mktemp -d)"
          cp deploy/airgap/install.sh deploy/airgap/selftest.sh \
             deploy/airgap/portable.sh "$bundle/"
          cp -r deploy/airgap/installer "$bundle/"
          cp deploy/compose/docker-compose.yml "$bundle/"
          printf '0.0.0-ci\n' > "$bundle/VERSION"
          printf '{"blocks":["CORE-BUS"],"images":["visionai/core-bus:0.0.0"],"infra":["redis"]}\n' \
            > "$bundle/plan.json"
          head -c 1048576 /dev/urandom > "$bundle/images.tar"
          ( . deploy/airgap/portable.sh
            cd "$bundle" && sorted_files . | sha256_list > SHA256SUMS )
          bash "$bundle/install.sh" --dry-run

      - name: 변조된 번들은 거부하는지
        # 통과만 확인하면 "항상 통과하는 검사"를 못 잡는다. 실제로 그 결함이
        # 있었고, 깨진 검사는 없는 검사보다 나쁘다 — 근거로 쓰이기 때문이다.
        run: |
          set -euo pipefail
          bundle="$(mktemp -d)"
          cp deploy/airgap/install.sh deploy/airgap/selftest.sh \
             deploy/airgap/portable.sh "$bundle/"
          cp -r deploy/airgap/installer "$bundle/"
          cp deploy/compose/docker-compose.yml "$bundle/"
          printf '0.0.0-ci\n' > "$bundle/VERSION"
          printf '{"blocks":["CORE-BUS"],"images":[],"infra":[]}\n' > "$bundle/plan.json"
          head -c 1048576 /dev/urandom > "$bundle/images.tar"
          ( . deploy/airgap/portable.sh
            cd "$bundle" && sorted_files . | sha256_list > SHA256SUMS )
          printf 'tampered\n' > "$bundle/VERSION"
          out="$(bash "$bundle/install.sh" --dry-run 2>&1)" && status=0 || status=$?

          # 종료 코드만 보면 안 된다. 포트 충돌 같은 다른 이유로 실패해도
          # 통과해 버리고, 그러면 무결성 검사가 죽어도 이 단계는 초록불이다.
          if [ "$status" -eq 0 ]; then
            echo "$out"
            echo "::error::변조된 번들이 사전 점검을 통과했다 — 무결성 검사가 아무것도 막지 않는다"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q '체크섬 불일치'; then
            echo "$out"
            echo "::error::실패하긴 했는데 무결성 때문이 아니다 — 이 단계가 검증하는 것이 아니다"
            exit 1
          fi
          printf '%s' "$out" | grep -q 'VERSION' || {
            echo "$out"
            echo "::error::어느 파일이 깨졌는지 알려 주지 않는다"
            exit 1
          }
          echo "✓ 변조를 거부했고, 깨진 파일을 짚어 줬다"

      - name: 설치 마법사 기동
        run: |
          set -euo pipefail
          bundle="$(mktemp -d)"
          printf '{"blocks":["CORE-BUS"],"images":[],"infra":[]}\n' > "$bundle/plan.json"
          printf '0.0.0-ci\n' > "$bundle/VERSION"
          python3 deploy/airgap/installer/server.py --bundle "$bundle" --port 8099 &
          server=$!
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/api/bundle >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8099/api/bundle | grep -q CORE-BUS
          curl -sf http://127.0.0.1:8099/ | grep -q "VisionAI 설치"
          kill "$server"
          echo "✓ 마법사가 뜨고 번들을 읽는다"

  change-control:
    # 혼합 정책의 기계 부분. 일상 변경은 main 직접 커밋으로 가고, 통제 대상
    # 경로만 PR을 거치게 한다. 문서로만 적어 두면 지켜지지 않고, 안 지켜진
    # 사실이 드러나지도 않는다 — 그래서 push 이벤트에서 검사한다.
    #
    # 병합 커밋이면 PR을 거친 것이므로 통과시킨다. 부모가 하나인 커밋이
    # 통제 경로를 건드렸다면 직접 push다.
    name: 변경 통제
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 통제 대상 경로가 PR을 거쳤는지
        run: |
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -ge 3 ]; then
            echo "병합 커밋 — PR을 거쳤다"
            exit 0
          fi

          patterns=$(grep -v '^\s*#' .github/change-control-paths.txt | grep -v '^\s*$')
          changed=$(git diff --name-only HEAD~1 HEAD -- $patterns)
          if [ -z "$changed" ]; then
            echo "통제 대상 경로 변경 없음 — 직접 커밋으로 충분하다"
            exit 0
          fi

          echo "::error::통제 대상 경로가 PR 없이 들어왔다. 되돌리고 PR로 다시 올린다."
          echo "$changed" | sed 's/^/  · /'
          echo ""
          echo "이 경로들은 인증 심사의 변경 통제 근거이거나, 틀렸을 때"
          echo "되돌리기가 비싼 곳이다. 기준은 .github/change-control-paths.txt에 있다."
          exit 1

  images:
    name: 블록 이미지 빌드
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        block: [core-bus, core-gw, aud-vad, stt-core, flt-micro, llm-gw, llm-sum,
                rag-kb, rag-srch, ta-assist, scn-studio, ui-agent, aud-rtp, spk-dia, ui-meet,
                core-lic, core-sec, core-adm, tts-core, bot-voice,
                ava-counsel]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ${{ matrix.block }} 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BLOCK=${{ matrix.block }}
          push: false
          tags: visionai/${{ matrix.block }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.block }}
          cache-to: type=gha,mode=max,scope=${{ matrix.block }}
